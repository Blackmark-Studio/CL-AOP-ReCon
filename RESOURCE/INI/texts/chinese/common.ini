string = GameMenuHelper_1, "起始条件与帮助"
string = GameMenuHelper_2, "角色动画： "
string = GameMenuHelper_3, "\n重要提示： \n如果更新补丁后角色无法移动， 请进入游戏设置， 点击“恢复默认”， 然后点击“应用”。 \n如果帧率（FPS）较低， 请降低分辨率， 或在启动器中将 MSAA 参数从 16 改为 2。 \n建议不要在 engine.ini 中设置过高的FPS（最佳范围为 60-100）， 或在启动器中开启垂直同步（V-Sync）。 \n建议使用新的配置文件名称开始新游戏！ \n反馈建议： \n您可以在“Steam 社区”留言。 \n如需更快捷、 更高效的在线技术支持， 请访问我们的 Discord 服务器。 \n祝您游戏愉快！ \n汉化校对人员Miria留言： \n有汉化相关的疑问和问题请在Q群找我或者工坊留言（如果工坊有）\n某些问题在怀疑是中文版的问题前先切换至俄语或者英语版本测试后再下定论， 之后再取消汉化MOD检查官方中文是否有问题以此来确认是不是汉化MOD导致的问题。 （假如还没整合） \n官方还有个Steam社区中文置顶帖子， 里面有Q群号码。 "
